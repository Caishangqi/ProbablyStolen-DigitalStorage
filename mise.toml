[tasks.check-ci]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py check-ci'

[tasks.check-format]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py check-format'

[tasks.ci-core]
dir = '{{config_root}}'
