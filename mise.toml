min_version = '2026.9.10'

[tools]
python = '3.13.7'
uv = '0.13.7'
actionlint = '1.7.12'

[settings]
exec_auto_install = false
task.run_auto_install = false

[tasks.setup]
dir = '{{config_root}}'
run = 'uv sync --locked'

[tasks.build-core]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py build-core'

[tasks.build-game]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py build-game'

[tasks.test-core]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py test-core'

[tasks.test-platform]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py test-platform'

[tasks.test-common]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py test-common'

[tasks.test-client]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py test-client'

[tasks.test-integration]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py test-integration'

[tasks.test-architecture]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py test-architecture'

[tasks.test-all]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py test-all'

[tasks.package]
dir = '{{config_root}}'
run = '"{{config_root}}/.venv/Scripts/python.exe" -B scripts/tool.py package'

[tasks.deploy]
